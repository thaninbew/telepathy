name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build app bundle
        run: ./scripts/build-app.sh release
      - name: Verify development bundle identity
        run: |
          test -f 'build/Telepathy Development.noindex/.metadata_never_index'
          app='build/Telepathy Development.noindex/Telepathy Development.app'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = "app.telepathy.macos.development"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$app/Contents/Info.plist")" = "Telepathy Development"
          ! /usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMultipleInstancesProhibited' "$app/Contents/Info.plist")" = "true"
