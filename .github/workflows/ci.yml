name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build app bundle
        run: ./scripts/build-app.sh release
      - name: Verify development bundle identity
        run: |
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/Telepathy.app/Contents/Info.plist)" = "app.telepathy.macos.development"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' build/Telepathy.app/Contents/Info.plist)" = "Telepathy Development"
